server {
    listen 80;
    listen [::]:80;
    server_name graffiti-zerkalo.ru www.graffiti-zerkalo.ru;

    root /var/www/graffiti-zerkalo/dist;
    index index.html;

    client_max_body_size 15m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # API backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images served directly from disk
    location /uploads/ {
        alias /var/www/graffiti-zerkalo/server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Never cache the HTML shell: it points to the current hashed JS bundle.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA static
    location / {
        try_files $uri $uri/ /index.html;
    }
}
