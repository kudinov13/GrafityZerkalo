server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name graffiti-zerkalo.ru;

    root /var/www/graffiti-zerkalo/dist;
    index index.html;
    access_log /var/log/nginx/graffiti-access.log timed;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    ssl_certificate /etc/letsencrypt/live/graffiti-zerkalo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graffiti-zerkalo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ~* /(sw|service-worker|serviceworker|pwa-sw)\.js$ {
        try_files /sw.js =404;
        add_header Clear-Site-Data '"cache", "storage"' always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /uploads/ {
        alias /var/www/graffiti-zerkalo/server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.graffiti-zerkalo.ru;
    access_log /var/log/nginx/graffiti-access.log timed;

    ssl_certificate /etc/letsencrypt/live/graffiti-zerkalo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graffiti-zerkalo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://graffiti-zerkalo.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name graffiti-zerkalo.ru www.graffiti-zerkalo.ru;
    access_log /var/log/nginx/graffiti-access.log timed;
    return 301 https://graffiti-zerkalo.ru$request_uri;
}
